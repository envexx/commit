[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 512 }
invariant = { runs = 16, depth = 64 }
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
arc_mainnet = "https://rpc.mainnet.arc.io"
arc_testnet = "https://rpc.testnet.arc.io"
